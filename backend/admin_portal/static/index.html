<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NextPath 数据运营台</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><strong>NextPath</strong><span>数据运营台</span></div>
      <nav>
        <button class="nav-item active" data-view="overview">总览</button>
        <button class="nav-item" data-view="data">基础数据</button>
        <button class="nav-item" data-view="sources">数据来源</button>
        <button class="nav-item" data-view="capture">采集录入</button>
        <button class="nav-item" data-view="review">审核发布</button>
        <button class="nav-item" data-view="models">分析模型</button>
        <button class="nav-item" data-view="users">用户管理</button>
      </nav>
      <p class="sidebar-note">未审核、未发布的数据不会进入家长端。</p>
    </aside>
    <main>
      <header class="topbar"><div><p class="eyebrow">DATA OPERATIONS</p><h1 id="pageTitle">数据总览</h1></div><div class="topbar-actions"><span id="currentUser" class="current-user"></span><button id="refreshButton" class="button secondary">刷新</button><button id="logoutButton" class="button secondary">退出</button></div></header>
      <div id="notice" class="notice hidden"></div>

      <section id="overview" class="view active">
        <div class="metrics" id="metrics"></div>
        <div class="grid-two">
          <section class="panel"><div class="panel-head"><h2>最近发布</h2><span>家长端正在使用</span></div><div id="releaseList" class="list"></div></section>
          <section class="panel"><div class="panel-head"><h2>待审核数据</h2><span>需要核对证据</span></div><div id="pendingPreview" class="list"></div></section>
        </div>
      </section>

      <section id="data" class="view">
        <section class="panel">
          <div class="panel-head"><div><h2>已发布基础数据</h2><span>仅显示家长端可读取的数据</span></div><select id="releaseSelect" class="release-select"></select></div>
          <div class="data-filter"><input id="dataSearch" placeholder="搜索学校名称、字段或内容"><select id="dataType"><option value="all">全部类别</option><option value="school">学校</option><option value="admission">招生录取</option><option value="policy">中招政策</option></select></div>
          <div id="publishedFactList" class="fact-list"></div>
        </section>
      </section>

      <section id="sources" class="view">
        <div class="grid-two wide-left">
          <section class="panel"><div class="panel-head"><h2>已登记来源</h2><span id="sourceCount"></span></div><div id="sourceList" class="list"></div></section>
          <section class="panel form-panel"><h2>登记数据来源</h2><form id="sourceForm" class="form-stack">
            <label>来源名称<input name="name" required placeholder="例如：西安市教育局"></label>
            <label>来源类别<select name="source_type"><option value="official">教育主管部门</option><option value="school_official">学校官方</option><option value="media">媒体公开信息</option><option value="expert">专家/机构</option><option value="parent">家长反馈</option><option value="manual">人工整理</option></select></label>
            <label>可信等级<select name="reliability"><option value="official">官方</option><option value="verified">已核验</option><option value="observation">待核验</option></select></label>
            <label>主页或原文链接<input name="homepage_url" type="url" placeholder="https://"></label>
            <button class="button" type="submit">保存来源</button>
          </form></section>
        </div>
      </section>

      <section id="capture" class="view">
        <div class="grid-two">
          <section class="panel form-panel"><h2>登记证据</h2><form id="evidenceForm" class="form-stack">
            <label>数据来源<select name="source_id" id="evidenceSource" required></select></label>
            <label>证据标题<input name="title" required placeholder="例如：2026 年高中招生录取工作方案"></label>
            <label>原文链接<input name="url" type="url" placeholder="https://"></label>
            <label>摘录<textarea name="excerpt" rows="4" placeholder="粘贴能够支持该事实的原文或关键说明"></textarea></label>
            <button class="button" type="submit">保存证据</button>
          </form></section>
          <section class="panel form-panel"><h2>录入候选数据</h2><form id="factForm" class="form-stack">
            <label>证据<select name="evidence_id" id="factEvidence" required></select></label>
            <div class="form-row"><label>数据类别<select name="fact_type"><option value="school">学校信息</option><option value="admission">招生录取</option><option value="policy">中招政策</option></select></label><label>参考年度<input name="reference_year" type="number" value="2026" min="2020" max="2100" required></label></div>
            <label>对象名称<input name="entity_name" required placeholder="例如：西安高新第一中学"></label>
            <label>字段名称<input name="field" required placeholder="例如：录取参考线"></label>
            <label>适用范围（JSON，可留空）<textarea name="scope" rows="2" placeholder='例如：{"batch":"第一批次"}'></textarea></label>
            <label>数据内容（JSON）<textarea name="value" rows="4" required placeholder='例如：{"score":600,"source":"官方公告"}'></textarea></label>
            <label>可信等级<select name="confidence"><option value="official">官方</option><option value="verified">已核验</option><option value="observation">待核验</option></select></label>
            <button class="button" type="submit">提交审核</button>
          </form></section>
        </div>
        <div class="grid-two top-gap">
          <section class="panel form-panel"><h2>上传资料</h2><form id="documentForm" class="form-stack" enctype="multipart/form-data">
            <label>数据来源<select name="source_id" id="documentSource"></select></label>
            <label>资料标题<input name="title" required placeholder="例如：2026 年高中招生计划 PDF"></label>
            <label>选择文件<input name="file" type="file" accept=".txt,.md,.csv,.json,.docx,.pdf" required></label>
            <button class="button secondary" type="submit">上传并提取</button>
          </form></section>
          <section class="panel"><div class="panel-head"><h2>待治理资料</h2><span id="ingestionCount"></span></div><div id="ingestionList" class="list"></div></section>
        </div>
        <div class="grid-two top-gap">
          <section class="panel"><div class="panel-head"><h2>采集任务</h2><span id="collectionCount"></span></div><div id="collectionList" class="list"></div></section>
          <section class="panel form-panel"><h2>新增网页采集</h2><form id="collectionForm" class="form-stack">
            <label>数据来源<select name="source_id" id="collectionSource"></select></label>
            <label>任务名称<input name="name" required placeholder="例如：教育局中招通知"></label>
            <label>网页地址<input name="target_url" type="url" required placeholder="https://"></label>
            <label>采集间隔（分钟）<input name="interval_minutes" type="number" min="15" value="1440" required></label>
            <label>治理提示<textarea name="extraction_hint" rows="3" placeholder="例如：重点核验招生计划和志愿规则"></textarea></label>
            <button class="button secondary" type="submit">保存任务</button>
          </form></section>
        </div>
      </section>

      <section id="review" class="view">
        <div class="grid-two wide-left">
          <section class="panel"><div class="panel-head"><h2>候选数据</h2><div class="segmented"><button data-status="pending_review" class="selected">待审核</button><button data-status="approved">已通过</button><button data-status="rejected">已拒绝</button></div></div><div id="factList" class="fact-list"></div></section>
          <section class="panel form-panel"><h2>发布数据版本</h2><p class="muted">仅会发布当前“已通过”列表中勾选的数据。</p><form id="releaseForm" class="form-stack">
            <label>版本名称<input name="name" required value="2026 西安城六区测试发布"></label>
            <div class="form-row"><label>地区<input name="region" value="西安" required></label><label>参考年度<input name="reference_year" type="number" value="2026" required></label></div>
            <label>发布说明<textarea name="notes" rows="4" placeholder="说明本次数据覆盖范围和注意事项"></textarea></label>
            <div id="releaseSelection" class="selection-note">尚未选择可发布的数据。</div>
            <button class="button" type="submit">发布到家长端</button>
          </form></section>
        </div>
      </section>

      <section id="users" class="view">
        <div class="grid-two wide-left">
          <section class="panel"><div class="panel-head"><h2>运营用户</h2><span>可登录数据运营台</span></div><div id="userList" class="list"></div></section>
          <section class="panel form-panel"><h2>新增用户</h2><form id="userForm" class="form-stack"><label>用户名<input name="username" required pattern="[A-Za-z0-9_-]{3,32}" placeholder="3-32 位字母、数字、下划线或连字符"></label><label>初始密码<input name="password" type="password" minlength="8" required placeholder="至少 8 位"></label><button class="button" type="submit">添加用户</button></form></section>
        </div>
      </section>

      <section id="models" class="view">
        <div class="grid-two wide-left">
          <section class="panel"><div class="panel-head"><h2>位置模型</h2><span>生效版本与验证记录</span></div><div id="modelList" class="list"></div><div id="validationList" class="list"></div></section>
          <section class="panel form-panel"><h2>模型参数</h2><form id="modelForm" class="form-stack"><input type="hidden" id="modelId"><label>位次区间比例<input id="rankIntervalRatio" type="number" min="0" max="1" step="0.01" required></label><label>最小位次区间<input id="minimumRankInterval" type="number" min="1" step="1" required></label><label>同校映射最少样本数<input id="schoolMappingMinSamples" type="number" min="2" step="1" required></label><label>同校映射权重<input id="schoolMappingWeight" type="number" min="0" max="1" step="0.05" required></label><label>分数通道基础不确定性（百分点）<input id="scoreChannelUncertainty" type="number" min="0.1" step="0.5" required></label><label>年级排名先验不确定性（百分点）<input id="rankPriorUncertainty" type="number" min="0.1" step="0.5" required></label><label>校准后排名不确定性（百分点）<input id="rankCalibratedUncertainty" type="number" min="0.1" step="0.5" required></label><label>排名通道最少样本数<input id="rankChannelMinSamples" type="number" min="2" step="1" required></label><label>通道冲突阈值（百分点）<input id="fusionConflictThreshold" type="number" min="0.1" step="0.5" required></label><label>证据相关性放大系数<input id="fusionCorrelationInflation" type="number" min="1" step="0.05" required></label><label>考试阶段不确定性 JSON<textarea id="difficultyStageUncertainty" rows="4"></textarea></label><label>已审核学校难度档案 JSON<textarea id="schoolDifficultyProfiles" rows="6" placeholder='{"某初中|一模":{"verified":true,"sample_count":24,"percentile_shift_pp":-1.5,"residual_uncertainty_pp":2}}'></textarea></label><button class="button" type="submit">保存参数</button></form><h2 class="subheading">登记验证结果</h2><form id="validationForm" class="form-stack"><label>验证年度<input name="validation_year" type="number" value="2026" required></label><label>样本量<input name="sample_size" type="number" min="0" value="0" required></label><label>位次中位绝对误差 <input name="median_absolute_rank_error" type="number" min="0" step="1"></label><label>区间覆盖率 <input name="interval_coverage" type="number" min="0" max="1" step="0.01"></label><label>验证说明<textarea name="notes" rows="3"></textarea></label><button class="button secondary" type="submit">保存验证记录</button></form></section>
        </div>
        <div class="grid-two wide-left top-gap"><section class="panel"><div class="panel-head"><h2>初中位置校准样本</h2><span id="calibrationSummary"></span></div><div id="calibrationList" class="list"></div></section><section class="panel form-panel"><h2>新增匿名样本</h2><form id="calibrationForm" class="form-stack"><label>地区<input name="region" value="西安" required></label><label>初中学校<input name="junior_school" required></label><label>考试阶段<select name="assessment_stage"><option>一模</option><option>二模</option><option>三模</option><option>期中</option><option>期末</option><option>月考</option><option>周测</option></select></label><label>中考年度<input name="cohort_year" type="number" value="2026" required></label><label>当时年级排名<input name="grade_rank" type="number" min="1" required></label><label>当时年级人数<input name="grade_size" type="number" min="1" required></label><label>最终中考区域排名<input name="final_city_rank" type="number" min="1" required></label><label>该届区域考生人数（建议填写）<input name="final_candidate_count" type="number" min="1"></label><label>来源备注<textarea name="source_note" rows="3"></textarea></label><button class="button secondary" type="submit">提交审核</button></form></section></div>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
